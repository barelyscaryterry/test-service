spring.application.name=test-service
test-service.ddb.table=beers

# Resilience4j - beerApi instance, applied to all Beer API calls
resilience4j.retry.instances.beerApi.max-attempts=3
resilience4j.retry.instances.beerApi.wait-duration=200ms
resilience4j.retry.instances.beerApi.enable-exponential-backoff=true
resilience4j.retry.instances.beerApi.exponential-backoff-multiplier=2
resilience4j.retry.instances.beerApi.retry-exceptions=com.trafficreplay.testservice.beer.BeerAdapterException

resilience4j.ratelimiter.instances.beerApi.limit-for-period=5
resilience4j.ratelimiter.instances.beerApi.limit-refresh-period=1s
resilience4j.ratelimiter.instances.beerApi.timeout-duration=0s

resilience4j.circuitbreaker.instances.beerApi.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.beerApi.sliding-window-size=20
resilience4j.circuitbreaker.instances.beerApi.minimum-number-of-calls=10
resilience4j.circuitbreaker.instances.beerApi.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.beerApi.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.beerApi.permitted-number-of-calls-in-half-open-state=5
resilience4j.circuitbreaker.instances.beerApi.record-exceptions=com.trafficreplay.testservice.beer.BeerAdapterException

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.health.circuitbreakers.enabled=true
management.health.ratelimiters.enabled=true

# CloudWatch metrics export - namespace/step match the dashboard in infra/terraform/cloudwatch.tf
management.cloudwatch.metrics.export.namespace=test-service
management.cloudwatch.metrics.export.step=1m
management.cloudwatch.metrics.export.batch-size=20
