version: 0.0
os: linux
files:
  - source: /app.jar
    destination: /opt/test-service-test
permissions:
  - object: /opt/test-service-test/app.jar
    owner: test-service-test
    group: test-service-test
    mode: "640"
hooks:
  ApplicationStop:
    - location: scripts/stop_service.sh
      timeout: 30
      runas: root
  ApplicationStart:
    - location: scripts/start_service.sh
      timeout: 30
      runas: root
  ValidateService:
    - location: scripts/validate_service.sh
      timeout: 60
      runas: root
